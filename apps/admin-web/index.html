<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- An admin console is not a public page. The referrer is stripped because nothing in this app links
         out to a customer-facing URL, and the CSP is deny-by-default so an injected script has nowhere to
         exfiltrate to. `unsafe-inline` for style only, which antd's CSS-in-JS runtime requires. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      `frame-ancestors` is NOT here on purpose. Chrome logs
      "The Content Security Policy directive 'frame-ancestors' is ignored when delivered via a <meta> element",
      and it is right: a meta CSP cannot express it, because framing is decided when the response *headers*
      arrive. Declaring it here produced a console warning on every single page load and no protection at all.

      Clickjacking defence therefore has to ship as a real header from Cloudflare Pages (_headers file) or a
      Pages Function. Until that exists, the console has no framing protection - which is why
      `admin-console-screens.md` A7 lists the header as a launch task rather than something this file does.

      Everything else IS expressible in meta, because it governs the document's own subresources.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'"
    />
    <title>Marketak · Admin</title>
    <!--
      `href="data:,"` is an empty data URL, which suppresses the automatic /favicon.ico request.

      The alternative was a real icon file, and that would put a hex literal in the repository outside
      `packages/ui/src/theme/colors.ts` — the one exemption `check-no-hardcoded-colors.mjs` grants. A favicon
      genuinely needs a fill colour, so the honest options are to widen that exemption or to have no icon yet.
      There is no icon yet, so the 404 is suppressed rather than papered over, and A7 (branding) is where a
      real icon and a widened exemption belong together.
    -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
